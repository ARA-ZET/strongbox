<script>
        // Micro-interactions for checkboxes
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const parent = this.closest('label');
                if (this.checked) {
                    parent.classList.remove('opacity-70', 'bg-surface-container-low');
                    parent.classList.add('bg-surface');
                    parent.querySelector('img').classList.remove('grayscale');
                } else {
                    parent.classList.add('opacity-70', 'bg-surface-container-low');
                    parent.classList.remove('bg-surface');
                    parent.querySelector('img').classList.add('grayscale');
                }
                
                // Update selection count
                const count = document.querySelectorAll('input[type="checkbox"]:checked').length;
                document.querySelector('.font-title.font-bold').innerText = `${count} items selected`;
            });
        });
    </script>
