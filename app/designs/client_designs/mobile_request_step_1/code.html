<script>
        // Micro-interaction for item selection
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        const itemCountDisplay = document.getElementById('item-count');

        checkboxes.forEach(checkbox => {
            checkbox.addEventListener('change', () => {
                const checkedCount = document.querySelectorAll('input[type="checkbox"]:checked').length;
                itemCountDisplay.textContent = checkedCount;
                
                // Visual feedback for the card
                const card = checkbox.closest('label');
                if(checkbox.checked) {
                    card.classList.add('border-secondary', 'bg-surface-container-low');
                    card.classList.remove('border-outline-variant', 'bg-surface');
                } else {
                    card.classList.remove('border-secondary', 'bg-surface-container-low');
                    card.classList.add('border-outline-variant', 'bg-surface');
                }
            });
        });

        // Initialize view based on default checked items
        window.addEventListener('DOMContentLoaded', () => {
            checkboxes.forEach(checkbox => {
                if(checkbox.checked) {
                    const card = checkbox.closest('label');
                    card.classList.add('border-secondary', 'bg-surface-container-low');
                    card.classList.remove('border-outline-variant', 'bg-surface');
                }
            });
        });
    </script>
