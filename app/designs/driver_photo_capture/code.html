<span class="material-symbols-outlined">replay</span>

<button class="flex-[1.5] py-4 px-6 rounded-xl bg-secondary-container font-label-lg text-label-lg text-on-secondary-container flex items-center justify-center gap-2 shadow-lg active:scale-95 transition-all" onclick="usePhoto()">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                Use Photo
            </button>
</div>

<script>
        function capturePhoto() {
            const flash = document.getElementById('flash');
            const controls = document.getElementById('camera-controls');
            const postCapture = document.getElementById('post-capture');

            // Visual feedback
            flash.classList.add('shutter-flash');
            
            setTimeout(() => {
                flash.classList.remove('shutter-flash');
                
                // Show post-capture UI
                controls.classList.add('opacity-0', 'pointer-events-none', 'translate-y-10');
                postCapture.classList.remove('translate-y-full');
            }, 150);
        }

        function retakePhoto() {
            const controls = document.getElementById('camera-controls');
            const postCapture = document.getElementById('post-capture');

            postCapture.classList.add('translate-y-full');
            setTimeout(() => {
                controls.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-10');
            }, 300);
        }

        function usePhoto() {
            // In a real app, this would upload or save
            alert('Photo saved to cargo log.');
            retakePhoto();
        }

        // Handle native mobile-like swipe to dismiss or pull up
        let touchstartY = 0;
        let touchendY = 0;

        const gestureZone = document.getElementById('post-capture');

        gestureZone.addEventListener('touchstart', e => {
            touchstartY = e.changedTouches[0].screenY;
        }, false);

        gestureZone.addEventListener('touchend', e => {
            touchendY = e.changedTouches[0].screenY;
            handleGesture();
        }, false);

        function handleGesture() {
            if (touchendY > touchstartY + 50) {
                // Swiped down
                retakePhoto();
            }
        }
    </script>
