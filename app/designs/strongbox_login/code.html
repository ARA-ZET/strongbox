<div class="glass-panel rounded-xl p-xl md:p-2xl flex flex-col items-center">
<!-- Logo & Brand Identity -->
<div class="flex flex-col items-center mb-xl text-center">

</div>
<!-- Form Section -->

<!-- Email Field -->

</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-lg text-label-lg text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">Forgot password?</a>

<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full h-[48px] pl-[48px] pr-md rounded-lg border border-outline-variant bg-white focus:border-primary focus:ring-2 focus:ring-primary/10 outline-none transition-all font-body-md text-body-md" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>

<!-- Divider -->

<div class="flex-grow border-t border-outline-variant"></div>

</div>

<script>
        // Simple input focus interaction
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('ring-offset-background');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('ring-offset-background');
            });
        });

        // Toggle password visibility (UI Only)
        const visibilityBtn = document.querySelector('button .material-symbols-outlined:contains("visibility")');
        if (visibilityBtn) {
            visibilityBtn.parentElement.addEventListener('click', () => {
                const input = visibilityBtn.parentElement.previousElementSibling;
                if (input.type === 'password') {
                    input.type = 'text';
                    visibilityBtn.innerText = 'visibility_off';
                } else {
                    input.type = 'password';
                    visibilityBtn.innerText = 'visibility';
                }
            });
        }
    </script>
