<body class="flex flex-col min-h-screen text-on-surface">

</div>

<!-- Main Content -->

<!-- Profile Header Section -->

<div class="relative flex flex-col items-center">

</div>
<h2 class="font-headline-md text-headline-md text-primary mb-xs">Marcus Henderson</h2>
<div class="flex items-center gap-xs text-on-surface-variant mb-xl">
<span class="material-symbols-outlined text-label-md">call</span>
<span class="font-body-md text-body-md">+1 (555) 924-4812</span>
</div>
</div>
</section>
<!-- Stats Bento Grid -->
<section class="px-margin mb-xl">

<div class="grid grid-cols-2 gap-gutter">
<!-- Stat Card 1 -->
<div class="bg-surface-container-low p-md rounded-xl border border-outline-variant shadow-sm flex flex-col gap-xs transition-transform active:scale-95">
<div class="flex justify-between items-start">

</div>
<!-- Stat Card 2 -->
<div class="bg-surface-container-low p-md rounded-xl border border-outline-variant shadow-sm flex flex-col gap-xs transition-transform active:scale-95">

<span class="font-label-md text-label-md">Account</span>
</a>

<script>
        function handleLogout() {
            // Visual feedback for logout
            const btn = event.currentTarget;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Logging out...';
            btn.style.opacity = '0.7';
            btn.style.pointerEvents = 'none';
            
            setTimeout(() => {
                alert('Successfully logged out of StrongBox Logistics.');
                location.reload();
            }, 1000);
        }

        // Add active state styles to the list items on tap
        document.querySelectorAll('button.w-full').forEach(button => {
            button.addEventListener('touchstart', () => {
                button.classList.add('bg-surface-container-high');
            });
            button.addEventListener('touchend', () => {
                setTimeout(() => button.classList.remove('bg-surface-container-high'), 150);
            });
        });
    </script>
