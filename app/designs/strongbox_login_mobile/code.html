<body class="bg-primary min-h-screen flex items-center justify-center p-gutter">
<!-- Subtle Background Pattern Overlay -->
<div class="absolute inset-0 opacity-10 pointer-events-none overflow-hidden">
<div class="w-full h-full bg-cover" data-alt="A sophisticated industrial logistics pattern background featuring technical blueprints of cargo ships and global trade routes. The aesthetic is professional and corporate, using a deep navy blue and subtle grey palette. The lighting is low and atmospheric, emphasizing the precision of modern shipping technology in a sleek digital art style." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCSPgE5xcP3VHEAE-oCD60ojXzoCkbaoiglvuhN2kWPlgZkQMaSZTSqy2W-esqi866y3nPcvLZ1k6bpbTb5efe_U2nMON3GsuUDy3K1I1AVMxAMnp4pRd7PEGRNZhNkXgIse3c3ypIhR6v-CG1eA7qF9XFl1nane1YB0eqXz3W8SeQj8-CoDG9wL8xU-kmdLb3jLNurTdULamk9sKOJKaVubaP9WXQBTzaPOMmIoPz9Xcl0O60j8Lny686FnqahwVHNLETmwe6ROvk')"></div>
</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-[400px]">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-xl">
<div class="w-16 h-16 bg-secondary-container rounded-xl flex items-center justify-center mb-md shadow-lg">
<span class="material-symbols-outlined text-on-secondary-container text-3xl" style="font-variation-settings: 'FILL' 1;">package_2</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-primary tracking-tight">StrongBox Logistics</h1>
<p class="font-label-lg text-label-lg text-on-primary-container mt-1">Enterprise Fleet Management</p>
</div>
<!-- Login Card -->
<div class="bg-surface rounded-xl p-lg login-card-shadow border border-outline-variant/30">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-xl">Welcome Back</h2>
<form class="space-y-md" onsubmit="event.preventDefault();">
<!-- Username/Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs uppercase" for="email">Work Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">person</span>
<input class="w-full h-12 pl-10 pr-4 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-transparent transition-all" id="email" placeholder="name@strongbox.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs uppercase" for="password">Security Key</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full h-12 pl-10 pr-12 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-transparent transition-all" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between py-2">
<label class="flex items-center gap-2 cursor-pointer">
<input class="w-4 h-4 rounded border-outline-variant text-secondary-container focus:ring-secondary-container" type="checkbox"/>
<span class="font-label-md text-label-md text-on-surface-variant">Remember device</span>
</label>
<a class="font-label-md text-label-md text-secondary font-semibold hover:underline" href="#">Forgot access?</a>
</div>
<!-- Sign In Button -->
<button class="w-full h-[48px] bg-secondary-container hover:bg-secondary-container/90 active:scale-[0.98] text-on-secondary-container font-bold rounded-lg transition-all flex items-center justify-center gap-2 mt-lg shadow-sm" type="submit">
<span class="font-label-lg text-label-lg uppercase tracking-wider">Sign In</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-xl">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-xs">
<span class="px-2 bg-surface text-outline font-label-md text-label-md">OR AUTHORIZE WITH</span>
</div>
</div>
<!-- Social Login -->
<button class="w-full h-[48px] bg-surface-container-lowest border border-outline-variant hover:bg-surface-container-low transition-colors flex items-center justify-center gap-3 rounded-lg active:scale-[0.98]" type="button">
<svg height="20" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-label-lg text-label-lg text-on-surface">Continue with Google</span>
</button>
</div>
<!-- Footer Links -->
<footer class="mt-xl text-center space-y-2">
<p class="font-body-sm text-body-sm text-on-primary-container/80">
                New dispatcher? <a class="text-secondary-container font-semibold hover:underline" href="#">Contact System Admin</a>
</p>
<div class="flex justify-center gap-4 pt-4 opacity-60">
<a class="font-label-md text-label-md text-on-primary hover:text-secondary-container transition-colors" href="#">Privacy Policy</a>
<span class="text-on-primary">•</span>
<a class="font-label-md text-label-md text-on-primary hover:text-secondary-container transition-colors" href="#">Terms of Service</a>
</div>
</footer>
</main>
<!-- Interactive Micro-interaction: Focus rings on input change -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
</body></html>
