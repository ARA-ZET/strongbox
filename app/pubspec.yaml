name: strong_box
description: "StrongBox Logistics — storage and transport management."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Data / serialisation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.0
  cloud_functions: ^5.0.4
  firebase_messaging: ^15.2.0

  # Navigation
  go_router: ^14.2.0

  # UI
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.2
  pdf: ^3.11.0
  printing: ^5.13.0
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0
  signature: ^5.4.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.2
  equatable: ^2.0.5
  url_launcher: ^6.3.0
  shared_preferences: ^2.5.5
  material_symbols_icons: ^4.2960.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.11
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  fake_cloud_firestore: ^3.0.2

flutter:
  uses-material-design: true
