name: Deploy Flutter app → Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "packages/**"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "functions/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

concurrency:
  group: deploy-app
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Regenerate design tokens
        run: node packages/tokens/build.mjs

      - name: Regenerate price list
        run: node packages/pricing/build.mjs

      - name: Write Firebase options (gitignored — see docs/SECURITY.md)
        run: |
          if [ -z "${FIREBASE_OPTIONS_DART}" ]; then
            echo "::error::FIREBASE_OPTIONS_DART secret is not set"; exit 1
          fi
          printf '%s' "${FIREBASE_OPTIONS_DART}" > app/lib/core/firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Codegen (freezed / riverpod / json)
        working-directory: app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Build web
        working-directory: app
        # Web push needs the project's public VAPID key (optional — without
        # it the app runs with push off). See docs/SECURITY.md.
        run: flutter build web --release --dart-define=FCM_VAPID_KEY="${FCM_VAPID_KEY}"
        env:
          FCM_VAPID_KEY: ${{ vars.FCM_VAPID_KEY }}

      # Functions logic + firestore.rules against the emulators, before the
      # rules deploy below. The emulators need Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Test Cloud Functions and Firestore rules
        working-directory: functions
        run: |
          npm ci
          npm test
          npx --yes firebase-tools@latest emulators:exec --project demo-strongbox \
            --only firestore,functions "node --test --test-concurrency=1 test-emulator/"

      # action-hosting-deploy only ships Hosting — rules need their own deploy.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STRONGBOX_APP }}

      - name: Deploy Firestore rules and indexes
        run: npx --yes firebase-tools@latest deploy --only firestore:rules,firestore:indexes --project strongbox-app --non-interactive

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STRONGBOX_APP }}
          projectId: strongbox-app
          channelId: live
          entryPoint: "."
